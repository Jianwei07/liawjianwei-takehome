[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Lightweight LLM evaluation harness for JSONL test suites"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eval-harness = "harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

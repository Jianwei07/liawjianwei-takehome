[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Lightweight HTTP evaluation service for JSONL test suites"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eval-endpoint = "main:main"
task = "main:task"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["harness"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
